version: '3.8'
services:
  backen
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MODEL_PATH=/app/assets/model/model.json
      - LABELS_PATH=/app/assets/class_indices.json
      - DB_PATH=/app/data/plant-disease.db
    volumes:
      - ./assets:/app/assets
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: green_hulk_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: green_hulk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d green_hulk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
